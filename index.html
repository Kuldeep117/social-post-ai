<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SavingHero 🦸 — Aaj Kitna Bachaya?</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0a0814;
  --surface: #130f24;
  --surface2: #1c1735;
  --border: #2a2448;
  --gold: #FFD700;
  --gold2: #FFA500;
  --purple: #7C3AED;
  --purple2: #9F67FF;
  --green: #10B981;
  --green2: #34D399;
  --red: #EF4444;
  --blue: #3B82F6;
  --pink: #EC4899;
  --text: #F1F0FF;
  --text2: #9B97C4;
  --radius: 20px;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* PARTICLES */
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle var(--d, 3s) ease-in-out infinite;
  opacity: 0;
}

@keyframes twinkle {
  0%,100% { opacity:0; transform: scale(0.5); }
  50% { opacity: var(--op, 0.6); transform: scale(1); }
}

/* CONFETTI */
.confetti-piece {
  position: fixed;
  width: 10px; height: 10px;
  top: -10px;
  pointer-events: none;
  z-index: 999;
  animation: confettiFall var(--cd, 3s) ease-in forwards;
  border-radius: var(--cr, 50%);
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg) translateX(var(--cx, 50px)); opacity: 0; }
}

/* LAYOUT */
.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 0 100px;
  position: relative;
  z-index: 1;
}

/* TOP NAV */
.topbar {
  background: linear-gradient(180deg, rgba(124,58,237,0.3) 0%, transparent 100%);
  padding: 20px 20px 0;
  text-align: center;
  position: relative;
}

.hero-logo {
  font-family: 'Baloo 2', cursive;
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--gold2), var(--purple2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

.hero-tagline {
  font-size: 0.78rem;
  color: var(--text2);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

/* HERO CARD */
.hero-card {
  margin: 0 16px 16px;
  background: linear-gradient(135deg, #1e1040, #2d1b6e, #1a0f3a);
  border: 1.5px solid rgba(159,103,255,0.3);
  border-radius: 24px;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255,215,0,0.15), transparent 70%);
}

.hero-card::after {
  content: '';
  position: absolute;
  bottom: -40px; left: -40px;
  width: 150px; height: 150px;
  background: radial-gradient(circle, rgba(124,58,237,0.2), transparent 70%);
}

.date-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 0.8rem;
  color: var(--text2);
}

.date-badge {
  background: rgba(255,255,255,0.08);
  padding: 5px 12px;
  border-radius: 50px;
  font-weight: 700;
}

.streak-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: linear-gradient(135deg, rgba(255,165,0,0.2), rgba(255,215,0,0.1));
  border: 1px solid rgba(255,215,0,0.3);
  padding: 5px 12px;
  border-radius: 50px;
  color: var(--gold);
  font-weight: 800;
  font-size: 0.82rem;
}

.saving-display {
  text-align: center;
  margin: 8px 0 16px;
}

.saving-label {
  font-size: 0.78rem;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.saving-amount {
  font-family: 'Baloo 2', cursive;
  font-size: 3.2rem;
  font-weight: 900;
  line-height: 1;
  transition: all 0.5s;
}

.saving-amount.positive {
  background: linear-gradient(135deg, var(--green), var(--green2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.saving-amount.negative {
  background: linear-gradient(135deg, var(--red), #FF6B6B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.saving-amount.zero {
  background: linear-gradient(135deg, var(--text2), var(--text));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-msg {
  text-align: center;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--gold);
  min-height: 22px;
  margin-bottom: 16px;
}

/* BUDGET BAR */
.budget-bar-wrap {
  margin-bottom: 8px;
}

.budget-bar-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text2);
  margin-bottom: 6px;
}

.budget-bar-track {
  height: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 50px;
  overflow: hidden;
}

.budget-bar-fill {
  height: 100%;
  border-radius: 50px;
  transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
  background: linear-gradient(90deg, var(--green), var(--green2));
}

.budget-bar-fill.warning {
  background: linear-gradient(90deg, var(--gold2), var(--gold));
}

.budget-bar-fill.danger {
  background: linear-gradient(90deg, var(--red), #FF6B6B);
}

/* STATS ROW */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin: 0 16px 16px;
}

.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 10px;
  text-align: center;
  transition: transform 0.2s;
}

.stat-box:hover { transform: translateY(-2px); }

.stat-box .val {
  font-family: 'Baloo 2', cursive;
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--gold);
}

.stat-box .lbl {
  font-size: 0.68rem;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

/* SECTION TITLE */
.sec-title {
  font-family: 'Baloo 2', cursive;
  font-size: 1.1rem;
  font-weight: 800;
  padding: 0 20px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* INPUT CARD */
.input-card {
  margin: 0 16px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.input-row {
  margin-bottom: 14px;
}

.input-label {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.input-field {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  outline: none;
  transition: border-color 0.3s;
}

.input-field:focus { border-color: var(--purple2); }
.input-field::placeholder { color: var(--text2); font-weight: 400; }

.input-row-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

/* CATEGORY PILLS */
.cat-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.cat-pill {
  padding: 7px 14px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text2);
}

.cat-pill.active {
  border-color: var(--purple2);
  background: rgba(159,103,255,0.15);
  color: var(--purple2);
}

/* BUTTONS */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-family: 'Baloo 2', cursive;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--purple2));
  color: white;
  box-shadow: 0 4px 20px rgba(124,58,237,0.4);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(124,58,237,0.6);
}

.btn-primary:active { transform: scale(0.98); }

.btn-success {
  background: linear-gradient(135deg, var(--green), #059669);
  color: white;
  box-shadow: 0 4px 20px rgba(16,185,129,0.4);
}

.btn-success:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(16,185,129,0.5);
}

/* TABS */
.tabs {
  display: flex;
  gap: 8px;
  padding: 0 16px;
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tab {
  padding: 8px 18px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 0.82rem;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
  color: var(--text2);
  transition: all 0.2s;
}

.tab.active {
  background: linear-gradient(135deg, var(--purple), var(--purple2));
  border-color: var(--purple);
  color: white;
}

/* EXPENSE LIST */
.expense-list {
  margin: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.expense-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.exp-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}

.exp-info { flex: 1; }

.exp-name {
  font-weight: 800;
  font-size: 0.9rem;
  margin-bottom: 2px;
}

.exp-meta {
  font-size: 0.72rem;
  color: var(--text2);
}

.exp-amount {
  font-family: 'Baloo 2', cursive;
  font-weight: 900;
  font-size: 1.1rem;
  color: var(--red);
}

.exp-del {
  background: rgba(239,68,68,0.1);
  border: none;
  color: var(--red);
  width: 30px; height: 30px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}

.exp-del:hover { background: rgba(239,68,68,0.25); }

/* BADGES */
.badges-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 0 16px 16px;
}

.badge-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  padding: 16px 10px;
  text-align: center;
  transition: all 0.3s;
}

.badge-card.unlocked {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,165,0,0.04));
  animation: badgePulse 3s ease-in-out infinite;
}

@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.2); }
  50% { box-shadow: 0 0 20px 4px rgba(255,215,0,0.2); }
}

.badge-icon {
  font-size: 2rem;
  margin-bottom: 6px;
  filter: var(--bf, grayscale(1) opacity(0.3));
}

.badge-card.unlocked .badge-icon { filter: none; }

.badge-name {
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--text2);
  line-height: 1.3;
}

.badge-card.unlocked .badge-name { color: var(--gold); }

/* WEEKLY CHART */
.chart-wrap {
  margin: 0 16px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 100px;
  margin-bottom: 8px;
}

.chart-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
  justify-content: flex-end;
}

.chart-bar {
  width: 100%;
  border-radius: 6px 6px 0 0;
  transition: height 1s cubic-bezier(0.34,1.56,0.64,1);
  min-height: 4px;
  background: linear-gradient(180deg, var(--green2), var(--green));
  position: relative;
  cursor: pointer;
}

.chart-bar.today {
  background: linear-gradient(180deg, var(--gold), var(--gold2));
  box-shadow: 0 0 12px rgba(255,215,0,0.4);
}

.chart-bar.negative {
  background: linear-gradient(180deg, #FF6B6B, var(--red));
}

.chart-day {
  font-size: 0.68rem;
  color: var(--text2);
  font-weight: 700;
}

/* AI COACH */
.ai-card {
  margin: 0 16px 16px;
  background: linear-gradient(135deg, #1a0f3a, #0d1f3a);
  border: 1.5px solid rgba(59,130,246,0.3);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.ai-card::before {
  content: '';
  position: absolute;
  top: -50%; right: -20%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 70%);
}

.ai-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.ai-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), #60A5FA);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
}

.ai-name {
  font-weight: 800;
  font-size: 0.9rem;
  color: #60A5FA;
}

.ai-subtitle {
  font-size: 0.7rem;
  color: var(--text2);
}

.ai-msg-box {
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 14px;
  font-size: 0.87rem;
  line-height: 1.6;
  color: var(--text);
  min-height: 60px;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}

.ai-input-row {
  display: flex;
  gap: 8px;
}

.ai-input {
  flex: 1;
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 50px;
  padding: 10px 16px;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 0.85rem;
  outline: none;
}

.ai-input:focus { border-color: #60A5FA; }
.ai-input::placeholder { color: var(--text2); }

.ai-send {
  background: linear-gradient(135deg, var(--blue), #60A5FA);
  border: none;
  border-radius: 50px;
  padding: 10px 18px;
  color: white;
  font-weight: 800;
  cursor: pointer;
  font-size: 0.85rem;
  font-family: 'Nunito', sans-serif;
  transition: all 0.2s;
}

.ai-send:hover { opacity: 0.85; transform: scale(1.02); }
.ai-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* CELEBRATION OVERLAY */
.celebration {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.celebration.show {
  opacity: 1;
  pointer-events: all;
}

.celebration-box {
  background: linear-gradient(135deg, #1e1040, #2d1b6e);
  border: 2px solid var(--gold);
  border-radius: 28px;
  padding: 40px 32px;
  text-align: center;
  max-width: 300px;
  box-shadow: 0 0 60px rgba(255,215,0,0.3);
  animation: celebPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes celebPop {
  from { transform: scale(0.5) rotate(-5deg); opacity: 0; }
  to { transform: scale(1) rotate(0deg); opacity: 1; }
}

.celeb-emoji { font-size: 4rem; margin-bottom: 12px; display: block; }

.celeb-title {
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.celeb-msg {
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 20px;
}

.celeb-close {
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  border: none;
  border-radius: 50px;
  padding: 12px 32px;
  font-family: 'Baloo 2', cursive;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  color: var(--bg);
  transition: transform 0.2s;
}

.celeb-close:hover { transform: scale(1.05); }

/* TOAST */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 10px 20px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 300;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(19,15,36,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 16px 12px;
  z-index: 100;
  max-width: 480px;
  margin: 0 auto;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: transparent;
}

.nav-item.active { background: rgba(159,103,255,0.15); }

.nav-icon { font-size: 1.3rem; }

.nav-label {
  font-size: 0.62rem;
  font-weight: 800;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.nav-item.active .nav-label { color: var(--purple2); }

/* VIEWS */
.view { display: none; }
.view.active { display: block; }

/* LOADING SPINNER */
.spin {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* LEVEL BAR */
.level-wrap {
  margin: 0 16px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
}

.level-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.level-name {
  font-family: 'Baloo 2', cursive;
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--gold);
}

.level-xp {
  font-size: 0.75rem;
  color: var(--text2);
  font-weight: 700;
}

.xp-track {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 50px;
  overflow: hidden;
}

.xp-fill {
  height: 100%;
  border-radius: 50px;
  background: linear-gradient(90deg, var(--gold2), var(--gold));
  transition: width 1s cubic-bezier(0.34,1.56,0.64,1);
}

/* EMPTY */
.empty {
  text-align: center;
  padding: 32px 20px;
  color: var(--text2);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

/* HISTORY */
.history-day {
  margin: 0 16px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.history-header {
  padding: 12px 16px;
  background: var(--surface2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  font-weight: 800;
}

.history-saved {
