<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SavingHero | Smart Finance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #050505;
        --card: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --lime: #C8F135;
    }
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg);
        color: #fff;
        overflow-x: hidden;
    }
    .syne { font-family: 'Syne', sans-serif; }
    
    /* Smooth Glow Background */
    .glow {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% -20%, rgba(200, 241, 53, 0.15), transparent 50%),
                    radial-gradient(circle at -10% 100%, rgba(79, 172, 254, 0.05), transparent 40%);
        z-index: -1;
    }

    /* Glass Cards */
    .glass {
        background: var(--card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 32px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass:hover {
        border-color: rgba(200, 241, 53, 0.3);
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(-5px);
    }

    /* Animated Button */
    .btn-lime {
        background: var(--lime);
        color: #000;
        font-weight: 800;
        padding: 18px 32px;
        border-radius: 18px;
        transition: 0.3s;
        box-shadow: 0 0 20px rgba(200, 241, 53, 0.2);
    }
    .btn-lime:hover {
        transform: scale(1.03);
        box-shadow: 0 0 40px rgba(200, 241, 53, 0.4);
    }

    input {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        color: #fff;
        outline: none;
        transition: 0.3s;
    }
    input:focus { border-color: var(--lime); background: rgba(255, 255, 255, 0.1); }

    .nav-blur { background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(15px); }
</style>
</head>
<body>

<div class="glow"></div>

<nav class="fixed w-full z-50 nav-blur border-b border-white/5">
    <div class="max-w-7xl mx-auto px-8 h-20 flex justify-between items-center">
        <div class="syne text-2xl font-black italic tracking-tighter">
            SAVING<span class="text-[#C8F135]">HERO.</span>
        </div>
        <div id="streakPill" class="flex items-center gap-2 bg-white/5 border border-white/10 px-4 py-2 rounded-full text-sm font-bold text-orange-400">
            🔥 <span id="streakNum">0</span> DAY STREAK
        </div>
    </div>
</nav>

<main class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
    <div class="grid lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-7 space-y-8">
            <div class="glass p-10 relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs font-black uppercase tracking-[4px] text-white/40 mb-4">Total Savings Today</p>
                    <h1 class="syne text-7xl md:text-9xl font-black italic mb-6" id="savBig">₹0</h1>
                    
                    <div class="w-full bg-white/5 h-3 rounded-full overflow-hidden mb-6">
                        <div id="pFill" class="h-full bg-[#C8F135] transition-all duration-700 shadow-[0_0_20px_#C8F135]" style="width: 0%"></div>
                    </div>
                    
                    <div class="flex justify-between text-sm font-bold text-white/40 uppercase tracking-widest">
                        <span>Spent: <span id="spLbl" class="text-white">₹0</span></span>
                        <span>Budget: <span id="bgLbl" class="text-white">₹0</span></span>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div class="glass p-8">
                    <p class="text-[10px] font-bold text-white/30 uppercase mb-2">Level</p>
                    <p class="text-2xl font-black syne">ROOKIE 01</p>
                </div>
                <div class="glass p-8">
                    <p class="text-[10px] font-bold text-white/30 uppercase mb-2">Next Goal</p>
                    <p class="text-2xl font-black syne">iPHONE 16</p>
                </div>
            </div>
        </div>

        <div class="lg:col-span-5 space-y-6">
            <div class="glass p-8">
                <h3 class="syne text-xl mb-6 italic uppercase">Set Daily Limit</h3>
                <div class="flex flex-col gap-4">
                    <input type="number" id="bgInp" placeholder="Enter Budget (₹)">
                    <button onclick="setBudget()" class="btn-lime uppercase text-xs tracking-widest">Set Limit ⚡</button>
                </div>
            </div>

            <div class="glass p-8">
                <h3 class="syne text-xl mb-6 italic uppercase">Add Expense</h3>
                <div class="flex flex-col gap-4">
                    <input type="text" id="exName" placeholder="What did you buy?">
                    <input type="number" id="exAmt" placeholder="Amount (₹)">
                    <button onclick="addExp()" class="w-full py-4 rounded-2xl bg-white/5 border border-white/10 font-bold hover:bg-white/10 transition">Save Log 💸</button>
                </div>
            </div>
        </div>

    </div>
</main>

<script>
let state = { budget: 0, expenses: [], streak: 0 };

function ui() {
    const spent = state.expenses.reduce((a, e) => a + e.amount, 0);
    const saved = state.budget - spent;
    const pct = state.budget > 0 ? Math.min((spent / state.budget) * 100, 100) : 0;

    // Numbers animation
    document.getElementById('savBig').textContent = `₹${saved.toLocaleString()}`;
    document.getElementById('spLbl').textContent = `₹${spent.toLocaleString()}`;
    document.getElementById('bgLbl').textContent = `₹${state.budget.toLocaleString()}`;
    document.getElementById('pFill').style.width = pct + '%';

    // Color Logic
    if(saved < 0) {
        document.getElementById('savBig').style.color = '#FF4757';
    } else {
        document.getElementById('savBig').style.color = '#C8F135';
    }
}

function setBudget() {
    const val = parseFloat(document.getElementById('bgInp').value);
    if(val > 0) {
        state.budget = val;
        ui();
        showToast('Limit Updated!');
    }
}

function addExp() {
    const name = document.getElementById('exName').value;
    const amt = parseFloat(document.getElementById('exAmt').value);
    if(name && amt > 0) {
        if(state.budget === 0) { return showToast('Set Budget First!'); }
        state.expenses.push({name, amount: amt});
        ui();
        document.getElementById('exName').value = '';
        document.getElementById('exAmt').value = '';
        showToast('Expense Added!');
    }
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = "fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full font-bold text-sm z-[2000] shadow-2xl";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}
</script>

</body>
</html>
